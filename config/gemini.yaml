# Configuração do experimento com Gemini pela camada LLM unificada.
#
# A seleção do fornecedor ocorre somente neste arquivo. O código Python continua
# independente de Gemini, OpenAI, Anthropic ou outro backend compatível.
# Esta versão fixa o modelo estável gemini-2.5-flash-lite. Qualquer troca de
# versão deve gerar outro YAML e outro run_id para preservar a rastreabilidade.

extends: "llm.yaml"

narrative:
  provider: "llm"
  prompt_version: "llm_soap_v2_qualitative"
  max_retries: 2
  llm:
    backend: "gemini"
    model_id: "gemini-2.5-flash-lite"
    generator_id: "llm-gemini-2.5-flash-lite-narrative"
    api_key_env: "GEMINI_API_KEY"
    response_format: "json_schema"
    temperature: 1.0
    max_output_tokens: 2048
    retry_backoff_seconds: 2.0
    send_seed: true
    request_options: {}

extraction:
  provider: "llm"
  extractor_id: "llm-gemini-2.5-flash-lite-extractor"
  ontology_version: "ontology_v2"
  prompt_version: "extracao_marcadores_v1"
  max_retries: 2
  stability:
    enabled: true
    n_records: 50
    repetitions: 3
  llm:
    backend: "gemini"
    model_id: "gemini-2.5-flash-lite"
    extractor_id: "llm-gemini-2.5-flash-lite-extractor"
    api_key_env: "GEMINI_API_KEY"
    response_format: "json_schema"
    temperature: 0.0
    max_output_tokens: 8192
    retry_backoff_seconds: 2.0
    send_seed: true
    request_options: {}

execution:
  action: "executar"
  run_id: "experimento_gemini_2_5_flash_lite"
  stop_after: null
  models: "all"
  skip_explanations: false
  skip_report: false
  run_tests: true
  validate_streamlit_artifacts: true
  replace_existing_run: false
  save_results: true
  package_project: true
