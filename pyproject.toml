[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-priorizacao-emulti"
version = "0.2.0"
description = "Pipeline de pesquisa com perfis inteiramente sintéticos para priorização simulada e-Multi"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "joblib>=1.3,<2",
  "llvmlite>=0.44,<1",
  "matplotlib>=3.8,<4",
  "numba>=0.61,<1",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "shap>=0.45,<1",
  "tabulate>=0.9,<1",
  "xgboost>=2,<4",
]

[project.optional-dependencies]
llm = ["litellm>=1,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]
demo = ["streamlit>=1.45,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["emulti_pipeline"]
branch = true
